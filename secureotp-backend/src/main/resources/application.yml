
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: secureotp-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/secureotp_db}
    username: ${DB_USERNAME:secureotp_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    show-sql: false

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

  otp:
    hmac-secret: ${OTP_HMAC_SECRET}
    expiry-minutes: 5
    resend-seconds: 60
    max-attempts: 5

  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 15
    refresh-expiry-days: 30
